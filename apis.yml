name: Gtctowers
description: 'GTC Towers is a telecommunications infrastructure company based in Ponte Vedra Beach, Florida,
  positioning itself as a customer-focused tower owner built by a team of wireless industry veterans. It
  develops and operates digital connectivity infrastructure including cell towers, small cells, and in-building
  wireless systems, alongside tower operations management, tower safety services, and Eco Power Wheels power
  solutions. GTC Towers leases tower space and supports carriers and enterprises through the various stages
  of tower siting, deployment, and growth. As of this enrichment pass the company publishes a corporate
  marketing website only, with no developer portal, API, or programmatic surface.'
